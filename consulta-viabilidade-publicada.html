<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta de Viabilidade</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--purple:#66536f;--blue:#087cf0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 70% 10%,#806d89,#4d4058 65%);color:#222}main{max-width:1450px;margin:auto;padding:22px 24px 30px}header{color:#fff;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:42px;margin:0;font-weight:800}header span{font-size:35px;font-weight:300}.filters,.card,.table-card{background:#fff}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:14px;margin-bottom:18px}.filter label{display:block;font-size:16px;margin-bottom:8px}.filter select,.filter input{width:100%;height:34px;border:1px solid #ddd;padding:7px;color:#666;background:#fff}.top{display:grid;grid-template-columns:1fr 1fr;gap:32px}.card{padding:10px 12px;height:230px;overflow:auto}.card h3{font-size:15px;font-weight:400;margin:0 0 10px}.card table,.results{width:100%;border-collapse:collapse;font-size:14px}.card th,.card td,.results th,.results td{text-align:left;padding:5px;border-bottom:1px solid #eee}.card th,.results th{font-weight:400}.card tr:nth-child(even),.results tr:nth-child(even){background:#e9e9e9}.card td:nth-child(2),.card td:nth-child(3){text-align:right}.total{font-weight:bold}.table-card{margin-top:18px;padding:10px;max-height:430px;overflow:auto}.results{min-width:900px}.results th{position:sticky;top:0;background:#fff}.muted{color:#666;font-size:13px;margin:8px 0}.upload{color:#fff;margin:0 0 14px}.upload input{background:#fff;color:#222;padding:8px;border-radius:3px}.count{font-weight:bold}@media(max-width:900px){h1{font-size:28px}.filters{grid-template-columns:repeat(2,1fr)}.top{grid-template-columns:1fr}header span{font-size:24px}}
</style></head>
<body><main>
<header><h1>Consulta de Viabilidade</h1><span>Linx</span></header>
<div class="upload">Carregue a planilha completa para consultar os 11.337 registros: <input id="file" type="file" accept=".xlsx,.xls,.csv"></div>
<section class="filters" id="filters"></section>
<section class="top"><div class="card"><h3>Classificação</h3><table><thead><tr><th>Classificação</th><th>Contagem de Ordem de Serviço</th><th>Média de Valor Mensal</th></tr></thead><tbody id="classSummary"></tbody></table></div><div class="card"><h3>Operadora (Produto)</h3><table><thead><tr><th>Operadora</th><th>Contagem de Ordem de Serviço</th><th>Média de Valor Mensal</th></tr></thead><tbody id="opSummary"></tbody></table></div></section>
<div class="table-card"><p class="muted"><span class="count" id="count">0</span> registros exibidos</p><table class="results"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</main><script>
const fields=[['Estado','Inventario[Estado]'],['Cidade','Inventario[Cidade]'],['Bairro','Inventario[Bairro]'],['Endereço','Inventario[Endereço]'],['CEP','Inventario[CEP]'],['Classificação','Inventario[Classificação]']];let rows=[];const sample=[['PB','JOAO PESSOA','AGUA FRIA','RODOVIA BR-230, 1957','58053002','OI S/A','Banda Larga > 100 Mbps',128.54],['PB','JOAO PESSOA','ALTIPLANO CABO BRANCO','AV JOAO CIRILO DA SILVA, 00221','58046005','EMBRATEL.','Banda Larga <= 100 Mbps',195.72],['PB','JOAO PESSOA','ALTIPLANO CABO BRANCO','RUA POETA TARGINO TEIXEIRA, 251','58046090','VIVO S/A','IP Dedicado < 10 Mbps',338.10],['PB','JOAO PESSOA','Distrito Industrial','RUA ESTEVAO BRETT, 546 A','58082001','EMBRATEL.','IP Dedicado 30-50 Mbps',357.45],['PB','JOAO PESSOA','JAGUARIBE','AVENIDA CAPITAO JOSE PESSOA, 1140','58015170','OI S/A','IP Dedicado 10-30 Mbps',406.44]];function key(r,n){return r[n]??r[n.replace('Inventario[','').replace(']','')]??''}function money(n){return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}function renderFilters(){filters.innerHTML=fields.map((f,i)=>`<div class="filter"><label>${f[0]}</label><select data-i="${i}"><option value="">Todos</option>${[...new Set(rows.map(r=>key(r,f[1])).filter(Boolean))].sort().map(x=>`<option>${x}</option>`).join('')}</select></div>`).join('');document.querySelectorAll('select').forEach(x=>x.onchange=render)}function filtered(){return rows.filter(r=>fields.every((f,i)=>{let v=document.querySelector(`[data-i="${i}"]`)?.value;return !v||key(r,f[1])==v}))}function summary(data,field){let m={};data.forEach(r=>{let k=key(r,field)||'(vazio)',v=Number(key(r,'[SumValor_Mensal]')||r['SumValor_Mensal']||r['Valor Mensal']||0);if(!m[k])m[k]={n:0,s:0};m[k].n++;m[k].s+=v});return Object.entries(m).sort((a,b)=>b[1].n-a[1].n).slice(0,20)}function render(){let data=filtered();count.textContent=data.length;let cols=['Inventario[Estado]','Inventario[Cidade]','Inventario[Bairro]','Inventario[Endereço]','Inventario[CEP]'];thead.innerHTML='<tr>'+cols.map(x=>`<th>${x.replace('Inventario[','').replace(']','')}</th>`).join('')+'</tr>';tbody.innerHTML=data.slice(0,1000).map(r=>'<tr>'+cols.map(x=>`<td>${key(r,x)}</td>`).join('')+'</tr>').join('');classSummary.innerHTML=summary(data,'Inventario[Classificação]').map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${money(v.s/v.n)}</td></tr>`).join('')+`<tr class="total"><td>Total</td><td>${data.length}</td><td>${money(data.reduce((a,r)=>a+Number(key(r,'[SumValor_Mensal]')||r['SumValor_Mensal']||0),0)/Math.max(1,data.length))}</td></tr>`;opSummary.innerHTML=summary(data,'Inventario[Operadora (Produto)]').map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${money(v.s/v.n)}</td></tr>`).join('')+`<tr class="total"><td>Total</td><td>${data.length}</td><td>${money(data.reduce((a,r)=>a+Number(key(r,'[SumValor_Mensal]')||r['SumValor_Mensal']||0),0)/Math.max(1,data.length))}</td></tr>`}file.onchange=async e=>{let b=await e.target.files[0].arrayBuffer(),wb=XLSX.read(b,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''});renderFilters();render()};rows=sample.map(x=>({'Inventario[Estado]':x[0],'Inventario[Cidade]':x[1],'Inventario[Bairro]':x[2],'Inventario[Endereço]':x[3],'Inventario[CEP]':x[4],'Inventario[Operadora (Produto)]':x[5],'Inventario[Classificação]':x[6],'[SumValor_Mensal]':x[7]}));renderFilters();render();
</script></body></html>
