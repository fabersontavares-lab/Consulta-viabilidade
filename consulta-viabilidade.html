<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de Viabilidade</title><style>:root{--p:#665574;--b:#1689e8}*{box-sizing:border-box}body{margin:0;font:14px Arial;background:linear-gradient(120deg,#56465f,#8a7891);color:#30343b}.wrap{max-width:1450px;margin:auto;padding:24px}.hero{color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 0 22px}.hero h1{font-size:38px;margin:0;font-weight:800}.brand{font-size:36px;font-weight:300}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:18px}.filter,.panel{background:#fff;padding:12px}.filter label{display:block;font-size:18px;margin-bottom:8px}.filter input,.filter select{width:100%;height:34px;border:1px solid #ddd;padding:7px;color:#777}.actions{display:flex;gap:10px;margin-bottom:12px}.btn{border:0;padding:11px 20px;cursor:pointer;font-weight:bold}.primary{background:var(--b);color:#fff}.light{background:#fff;color:#555}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{overflow:auto}.panel h3{font-size:16px;margin:0 0 10px;font-weight:400}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;border-bottom:1px solid var(--b);padding:6px;font-weight:400}td{padding:6px}tr:nth-child(even){background:#e9e9e9}.results{margin-top:18px}.hint{color:#fff;font-size:13px}.empty{text-align:center;padding:24px;color:#777}@media(max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}}@media(max-width:520px){.filters{grid-template-columns:1fr}.wrap{padding:12px}.hero h1{font-size:28px}.brand{font-size:25px}}</style></head><body><main class="wrap"><header class="hero"><h1>Consulta de Viabilidade</h1><div class="brand">Linx</div></header><section class="filters"><div class="filter"><label>Estado</label><select id="estado"><option value="">Todos</option></select></div><div class="filter"><label>Cidade</label><input id="cidade" placeholder="Todos"></div><div class="filter"><label>Bairro</label><input id="bairro" placeholder="Todos"></div><div class="filter"><label>Endereço</label><input id="endereco" placeholder="Todos"></div><div class="filter"><label>CEP</label><input id="cep" placeholder="Todos"></div><div class="filter"><label>Classificação</label><select id="classe"><option value="">Todos</option></select></div></section><div class="actions"><button class="btn primary" onclick="consultar()">Consultar</button><button class="btn light" onclick="limpar()">Limpar filtros</button></div><p class="hint" id="status">Página pública com dados de demonstração.</p><section class="cards"><div class="panel"><h3>Classificação</h3><table><thead><tr><th>Classificação</th><th>Contagem</th><th>Média mensal</th></tr></thead><tbody id="sumClasse"></tbody></table></div><div class="panel"><h3>Operadora (Produto)</h3><table><thead><tr><th>Operadora</th><th>Contagem</th><th>Média mensal</th></tr></thead><tbody id="sumOp"></tbody></table></div></section><section class="panel results"><table><thead><tr><th>Estado</th><th>Cidade</th><th>Bairro</th><th>Endereço</th><th>CEP</th><th>Operadora</th><th>Classificação</th><th>Valor mensal</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const dados=[{estado:'PB',cidade:'JOAO PESSOA',bairro:'AGUA FRIA',endereco:'RODOVIA BR-230, 1957',cep:'58053002',op:'OI S/A',classe:'Banda Larga > 100 Mbps',valor:128.54},{estado:'PB',cidade:'JOAO PESSOA',bairro:'ALTIPLANO CABO BRANCO',endereco:'AV JOAO CIRILO DA SILVA, 00221',cep:'58046005',op:'EMBRATEL.',classe:'Banda Larga <= 100 Mbps',valor:195.72},{estado:'PB',cidade:'JOAO PESSOA',bairro:'ALTIPLANO CABO BRANCO',endereco:'RUA POETA TARGINO TEIXEIRA, 251',cep:'58046090',op:'VIVO S/A',classe:'IP Dedicado < 10 Mbps',valor:338.10},{estado:'PB',cidade:'JOAO PESSOA',bairro:'Distrito Industrial',endereco:'RUA ESTEVAO BRETT, 546 A',cep:'58082001',op:'SUMICITY TELECOMUNICACOES',classe:'IP Dedicado 30-50 Mbps',valor:357.45},{estado:'PB',cidade:'JOAO PESSOA',bairro:'JAGUARIBE',endereco:'AVENIDA CAPITAO JOSE PESSOA, 1140',cep:'58015170',op:'BRISANET TELECOMUNICAÇÕES',classe:'IP Dedicado 10-30 Mbps',valor:406.44},{estado:'PB',cidade:'JOAO PESSOA',bairro:'MANAIRA',endereco:'RUA MANOEL ARRUDA CAVALCANTI',cep:'58037000',op:'PARAIBA TELEOS, VIDEO WAL',classe:'Banda Larga > 100 Mbps',valor:179.90}];const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function options(){[...new Set(dados.map(x=>x.estado))].sort().forEach(x=>estado.insertAdjacentHTML('beforeend',`<option>${x}</option>`));[...new Set(dados.map(x=>x.classe))].sort().forEach(x=>classe.insertAdjacentHTML('beforeend',`<option>${x}</option>`))}function filtrados(){let f={estado:estado.value,cidade:cidade.value,bairro:bairro.value,endereco:endereco.value,cep:cep.value,classe:classe.value};return dados.filter(x=>Object.entries(f).every(([k,v])=>!v||String(x[k]).toLowerCase().includes(v.toLowerCase())))}function resumo(a,k,id){let m={};a.forEach(x=>{(m[x[k]]??=[]).push(x.valor)});document.getElementById(id).innerHTML=Object.entries(m).map(([k,v])=>`<tr><td>${k}</td><td>${v.length}</td><td>${money(v.reduce((a,b)=>a+b,0)/v.length)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nenhum resultado</td></tr>'}function consultar(){let a=filtrados();rows.innerHTML=a.map(x=>`<tr><td>${x.estado}</td><td>${x.cidade}</td><td>${x.bairro}</td><td>${x.endereco}</td><td>${x.cep}</td><td>${x.op}</td><td>${x.classe}</td><td>${money(x.valor)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhum resultado</td></tr>';resumo(a,'classe','sumClasse');resumo(a,'op','sumOp');status.textContent=`${a.length} registro(s) encontrado(s) na demonstração.`}function limpar(){document.querySelectorAll('input').forEach(x=>x.value='');estado.value='';classe.value='';consultar()}options();consultar();</script></body></html>
